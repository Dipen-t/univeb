version: '3.8'

services:
  # 1. The Brain (Redis)
  redis:
    container_name: univibe-redis
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  # 2. The Memory (Postgres)
  db:
    container_name: univibe-db
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: univibe
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  # 3. The Conductor (Go Backend)
  conductor:
    container_name: univibe-conductor
    build: ./conductor
    ports:
      - "8080:8080"
    environment:
      - REDIS_ADDR=redis:6379
      - DATABASE_URL=postgres://user:password@db:5432/univibe?sslmode=disable
      - PORT=8080
    depends_on:
      - redis
      - db
    # No volumes here! This ensures we run the BUILT code, not the local file.
    restart: on-failure

  # 4. The Librarian (Python Worker)
  librarian:
    container_name: univibe-librarian
    build: ./librarian
    environment:
      - REDIS_URL=redis://redis:6379
      # If you use a .env file for the API Key, uncomment this:
      # - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
    depends_on:
      - redis
    restart: on-failure

volumes:
  redis_data:
  db_data: